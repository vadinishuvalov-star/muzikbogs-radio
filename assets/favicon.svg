      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="55%" stop-color="#0d0819"/>
      <stop offset="100%" stop-color="#1d0824"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ceaff"/>
      <stop offset="50%" stop-color="#ff2ea6"/>
      <stop offset="100%" stop-color="#ff8ad8"/>
