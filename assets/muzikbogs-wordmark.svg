<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 510 1020 200" width="1020" height="200" role="img" aria-label="МЮЗИКБОГС">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ffff"/><stop offset="26%" stop-color="#7ff7ff"/>
      <stop offset="60%" stop-color="#00cdf2"/><stop offset="100%" stop-color="#0a67b4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff2fc"/><stop offset="24%" stop-color="#ff8ae2"/>
      <stop offset="60%" stop-color="#ff1e9c"/><stop offset="100%" stop-color="#990074"/>
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-70%" width="160%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Arial Narrow,Arial,sans-serif" font-weight="900" font-size="170">
    <g filter="url(#glowCyan)">
      <text x="110" y="660" fill="url(#cyan)" textLength="544" lengthAdjust="spacingAndGlyphs">МЮЗИК</text>
      <text x="981" y="660" fill="url(#cyan)" textLength="109" lengthAdjust="spacingAndGlyphs">С</text>
    </g>
    <g filter="url(#glowPink)">
      <text x="654" y="660" fill="url(#pink)" textLength="327" lengthAdjust="spacingAndGlyphs">БОГ</text>
    </g>
    <text x="110" y="660" fill="url(#cyan)" textLength="544" lengthAdjust="spacingAndGlyphs">МЮЗИК</text>
    <text x="981" y="660" fill="url(#cyan)" textLength="109" lengthAdjust="spacingAndGlyphs">С</text>
    <text x="654" y="660" fill="url(#pink)" textLength="327" lengthAdjust="spacingAndGlyphs">БОГ</text>
  </g>
</svg>
